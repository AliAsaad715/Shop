# Copy .env.example to .env and set JWT_SIGNING_KEY before the first run.
# Run `docker compose up`; add --build after code changes.
name: shop

services:
  api:
    build:
      context: .
      dockerfile: src/Shop.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Images__RootPath: /data/images
      ConnectionStrings__Shop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop}
      # Seeded on startup in the Admin role; change both outside local demos
      Admin__Email: ${ADMIN_EMAIL:-admin@shop.local}
      Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - images:/data/images
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    ports:
      # Localhost only, and 5433 so a Postgres installed on the host can keep 5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Mounted at the parent: Postgres 18+ keeps its data in a versioned folder under it
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: first-run setup listens only on the socket, so this waits for the real server
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

volumes:
  postgres-data:
  images:
