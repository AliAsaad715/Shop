# Copy .env.example to .env and set JWT_SIGNING_KEY and S3_SECRET_KEY before the first run. The inventory service
# builds from the warehouse submodule, so clone with --recurse-submodules.
# Run `docker compose up`; add --build after code changes. The API answers at http://localhost:8080 (API_PORT),
# through Nginx.
name: shop

# Everything the three API instances share (task R5-03): they differ only in their name. None publishes a port, so
# nothing reaches an instance without going through Nginx. YAML merges are shallow, so a service that adds to the
# environment merges that part's own anchor too; the migrator overrides its inherited dependencies
x-api: &api
  # One image for the three: building any of them builds it
  image: shop-api
  build:
    context: .
    dockerfile: src/Shop.Api/Dockerfile
  environment: &api-environment
    ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    # One source for the actual network and the API's trust boundary (R5-05).
    ReverseProxy__Enabled: "true"
    ReverseProxy__TrustedNetworks__0: ${SHOP_NETWORK_SUBNET:-172.30.50.0/24}
    Images__Provider: S3
    Images__S3__Endpoint: http://seaweedfs:8333
    Images__S3__Bucket: ${S3_BUCKET:-shop-images}
    Images__S3__AccessKey: ${S3_ACCESS_KEY:-shop-images}
    Images__S3__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    # R5-09: budget BOTH pools on the primary, because the read pool can fall back there. Three APIs use at most
    # 3 * (15 + 10) = 75 connections; three workers use 15 more, leaving 10 of Postgres's 100 for tools/reserves.
    ConnectionStrings__Shop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop};Maximum Pool Size=${API_DB_POOL_SIZE:-15};Application Name=shop-api
    ConnectionStrings__ShopRead: Host=db-replica,postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop};Target Session Attributes=prefer-standby;Timeout=2;Host Recheck Seconds=5;Maximum Pool Size=${API_READ_DB_POOL_SIZE:-10};Application Name=shop-api-read
    ReadRouting__Enabled: ${READ_ROUTING_ENABLED:-false}
    ReadRouting__PrimaryWindow: ${READ_YOUR_WRITES_WINDOW:-00:00:10}
    # Used only by the explicit migrator; change both outside local demos
    Admin__Email: ${ADMIN_EMAIL:-admin@shop.local}
    Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
    # The demo catalog, with the same product IDs as the warehouse seed (warehouse/db/002_seed.sql)
    DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-true}
    Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
    LoginRateLimit__PermitLimit: ${LOGIN_RATE_LIMIT_PERMIT_LIMIT:-5}
    LoginRateLimit__WindowSeconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
    Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
    # The warehouse's gRPC endpoint: plain HTTP/2 inside the compose network
    Inventory__Address: http://inventory:50051
    ConnectionStrings__Redis: redis:6379
    CatalogCache__Enabled: ${CATALOG_CACHE_ENABLED:-true}
    # Order events (task R4-01); the API connects in the background and is Degraded while RabbitMQ is down
    RabbitMq__Host: rabbitmq
    RabbitMq__UserName: ${RABBITMQ_USER:-shop}
    RabbitMq__Password: ${RABBITMQ_PASSWORD:-shop}
  depends_on:
    migrator:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    seaweedfs:
      condition: service_healthy
    # Started first but not awaited: the app runs Degraded without the warehouse, so a warehouse
    # that never gets healthy must not keep the shop down
    inventory:
      condition: service_started
    redis:
      condition: service_healthy
    # Not awaited either: orders still save while RabbitMQ is down, and their events wait in the outbox (R4-02)
    rabbitmq:
      condition: service_started
  healthcheck:
    # Answers /health, Healthy or Degraded alike. The image has no curl, so bash sends the request itself
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 3 head -n 1 <&3 | grep -q ' 200 '"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s
    start_interval: 1s

services:
  # The same image as the API, but it initializes all four schemas and seeds, then exits without starting a host.
  # Override the anchor's dependencies to avoid waiting for ourselves or for optional runtime services (R5-04).
  migrator:
    <<: *api
    environment:
      <<: *api-environment
      ConnectionStrings__Shop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop};Maximum Pool Size=${MIGRATOR_DB_POOL_SIZE:-5};Application Name=shop-migrator
    command: ["--migrate-and-seed"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      # Demo seeding writes images through the same S3 provider as the API (R5-07).
      seaweedfs:
        condition: service_healthy

  # Explicit upgrade command only; never imports, migrates or seeds during ordinary API startup.
  # Retain the old volume as a read-only source: docker compose --profile tools run --rm image-import
  image-import:
    <<: *api
    profiles: [tools]
    command: ["--import-images"]
    restart: "no"
    environment:
      <<: *api-environment
      Images__RootPath: /legacy-images
    volumes:
      - images:/legacy-images:ro
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # One shared object store for this requirement; all metadata and object data persist under /data.
  # No public ports: images are served by /images/... through Nginx. The tools overlay offers loopback-only S3.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-ip.bind=0.0.0.0", "-webdav=false", "-admin.ui=false", "-s3.autoCreateBucket=false"]
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-shop-images}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-shop-images}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8888/buckets/$$S3_BUCKET/ && nc -z 127.0.0.1 8333"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
      start_interval: 1s

  # The three API instances behind Nginx (task R5-03), named so Nginx can list them and a demo can stop exactly one.
  # Each sends its name in the X-Instance header and in its RabbitMQ connection's name. All three wait for the
  # migrator to finish successfully, then start independently; none migrates or seeds at startup (R5-04).
  api1:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_NAME: api1

  api2:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_NAME: api2

  api3:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_NAME: api3

  # The load balancer (task R5-02) and the only way in: http://localhost:8080 (API_PORT). It spreads requests over
  # api1-api3 with least_conn and routes around one that stops (deploy/nginx/default.conf)
  nginx:
    image: nginx:1.30.7-alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # Started, not healthy: Nginx copes with an instance that is down or not up yet (resolve, passive health checks)
    depends_on:
      - api1
      - api2
      - api3

  # The email worker (task R4-03): consumes order confirmations from RabbitMQ in its own container, so stopping it
  # never touches the API, and the emails wait in the queue meanwhile. The migrator prepares its notifications schema.
  # Three of them share the queue (task R5-03): RabbitMQ gives each message to one. These act on all three:
  #   docker compose stop worker     # orders still return 201; RabbitMQ's UI shows the messages waiting
  #   docker compose start worker    # they drain the queue
  worker:
    build:
      context: .
      dockerfile: src/Shop.Worker/Dockerfile
    deploy:
      replicas: 3
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Shop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop};Maximum Pool Size=${WORKER_DB_POOL_SIZE:-5};Application Name=shop-worker
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_USER:-shop}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-shop}
      # Email (task R4-04). The one switch: Mailpit catches every email; Smtp sends for real with the SMTP_* settings.
      # k6 runs must stay on Mailpit: their orders use made-up addresses, and a real account would be blocked
      Email__Provider: ${EMAIL_PROVIDER:-Mailpit}
      Email__From: ${EMAIL_FROM:-Shop <orders@shop.local>}
      Email__Mailpit__Host: mailpit
      Email__Mailpit__Port: 1025
      Email__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__UserName: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
    # docker compose stop sends SIGTERM and kills the container after this long. The worker takes up to 20 s to
    # finish the email it is sending; Docker's default of 10 s would cut it off
    stop_grace_period: 30s
    restart: unless-stopped
    depends_on:
      migrator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Not awaited: the worker keeps trying until RabbitMQ is up
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started

  # Catches every email the worker sends while Email__Provider is Mailpit (task R4-04), so local runs and k6 never
  # mail a real address. Its inbox is at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      # Keeps the newest 5,000 and deletes older ones; a k6 run sends one email per order
      MP_MAX_MESSAGES: 5000
    ports:
      # Localhost only: the inbox, and SMTP for a worker run with dotnet run
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # The message broker (task R4-01). The management UI is at http://localhost:15672, signed in with
  # RABBITMQ_USER and RABBITMQ_PASSWORD. The app declares the exchanges and queues itself when it connects.
  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    # RabbitMQ keeps its data under its node name, rabbit@<hostname>. A fixed hostname keeps that name when the
    # container is re-created, so the volume's queues and messages are found again
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      # Only read when the volume is empty, like Postgres's. After changing them, remove just this volume:
      #   docker compose rm -sf rabbitmq && docker volume rm shop_rabbitmq-data
      # The built-in guest user can't log in from another container, so the app needs its own user
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop}
    ports:
      # Localhost only: AMQP for a local `dotnet run`, and the management UI
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # The image's plugins plus shovel (task R4-05), which moves dead-lettered messages back: the management UI's
      # "Move messages" on a queue's page, or the command in the README
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      # Healthy once the AMQP listener accepts connections, not merely once the node is up
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
      start_interval: 2s

  redis:
    image: redis:8.10.3-alpine
    # Login counters share this server with the catalog (R5-06). Do not evict live quotas to make room for cache
    # entries: at the memory limit cache writes fail softly and login fails closed until memory is available.
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
      start_interval: 1s
      start_period: 10s

  postgres:
    image: postgres:18
    # Reap health-check children outside Postgres: a timed-out probe must not trigger crash recovery.
    init: true
    # pg_stat_statements counts every statement's calls and time (task R3-04); perf/top-queries.sh lists the costliest.
    # db/pg_hba.conf lets db-replica stream WAL (task R3-10), and its slot may hold at most 1 GB of WAL for it: a
    # replica stopped for longer loses its slot and has to be copied again, rather than filling the primary's disk
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=1GB
    # Comes back with Docker after a reboot, so a local `dotnet run` finds it on 5433
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    ports:
      # Localhost only, and 5433 so a Postgres installed on the host can keep 5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Mounted at the parent: Postgres 18+ keeps its data in a versioned folder under it
      - postgres-data:/var/lib/postgresql
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      # Over TCP: first-run setup listens only on the socket, so this waits for the real server
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # A streaming replica of postgres (task R3-10), for reads that may be a moment old; R3-11 sends them there. The
  # first start copies the primary with pg_basebackup -R (db/replica-entrypoint.sh), then it replays the primary's WAL
  # as it comes. Only with its profile, so the default stack and every step measured before R3-11 run without it:
  #   docker compose --profile replica up -d --wait
  # perf/replica-lag.sh shows how far behind it is.
  db-replica:
    image: postgres:18
    init: true
    profiles: [replica]
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      # Its name in the primary's pg_stat_replication
      - -c
      - cluster_name=db-replica
      # Tells the primary which rows its reads still need, so vacuum there doesn't cancel them
      - -c
      - hot_standby_feedback=on
      # Demos only: replays every change this long after the primary made it, such as 5s (R3-11's stale-read demo)
      - -c
      - recovery_min_apply_delay=${REPLICA_APPLY_DELAY:-0}
    environment:
      # The primary's superuser, to create the replicator role on the first start; the copy brings every other role
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-replicator}
    ports:
      # Localhost only, next to the primary's 5433
      - "127.0.0.1:${REPLICA_PORT:-5434}:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Healthy only as a standby: a replica that was never copied, or was promoted, isn't one
      test: ["CMD-SHELL", "psql -X -At -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 10
      # The first start copies the whole primary first
      start_period: 300s
      start_interval: 2s

  # The Go warehouse (task R2-02). gRPC on 50051 inside the compose network only, never published to
  # the host; the image's own HEALTHCHECK asks the warehouse's gRPC health service.
  inventory:
    build:
      context: warehouse
    environment:
      # The password comes in through PGPASSWORD, which pgx reads, so it needs no quoting or URL encoding
      INVENTORY_DATABASE_URL: host=inventory-db port=5432 dbname=${INVENTORY_DB_NAME:-inventory} user=${INVENTORY_DB_USER:-inventory} sslmode=disable
      PGPASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      INVENTORY_LOG_LEVEL: ${INVENTORY_LOG_LEVEL:-info}
      # Demos only: holds every inventory call this long, to show the app's deadlines (tests/proof)
      INVENTORY_DELAY_MS: ${INVENTORY_DELAY_MS:-0}
    expose:
      - "50051"
    networks:
      - default
      - inventory-data
    depends_on:
      inventory-db:
        condition: service_healthy

  # The warehouse's own database (task R2-03), on a network the app isn't on, so the app has no route to it
  inventory-db:
    image: postgres:18
    init: true
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    volumes:
      - inventory-db-data:/var/lib/postgresql
      # Schema and seed, run in name order the first time the volume is empty
      - ./warehouse/db:/docker-entrypoint-initdb.d:ro
    networks:
      - inventory-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  default:
    ipam:
      config:
        - subnet: ${SHOP_NETWORK_SUBNET:-172.30.50.0/24}
  # Only the warehouse and its database; internal, so nothing on it reaches outside Docker
  inventory-data:
    internal: true

volumes:
  postgres-data:
  postgres-replica-data:
  # Legacy image source for the explicit importer; API instances never mount it (R5-07).
  images:
  seaweedfs-data:
  inventory-db-data:
  rabbitmq-data:
