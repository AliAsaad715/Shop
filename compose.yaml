# Copy .env.example to .env and set JWT_SIGNING_KEY before the first run. The inventory service
# builds from the warehouse submodule, so clone with --recurse-submodules.
# Run `docker compose up`; add --build after code changes.
name: shop

services:
  api:
    build:
      context: .
      dockerfile: src/Shop.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Images__RootPath: /data/images
      ConnectionStrings__Shop: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=${POSTGRES_USER:-shop};Password=${POSTGRES_PASSWORD:-shop}
      # Seeded on startup in the Admin role; change both outside local demos
      Admin__Email: ${ADMIN_EMAIL:-admin@shop.local}
      Admin__Password: ${ADMIN_PASSWORD:-Admin123!}
      # The demo catalog, with the same product IDs as the warehouse seed (warehouse/db/002_seed.sql)
      DemoSeed__Enabled: ${DEMO_SEED_ENABLED:-true}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      LoginRateLimit__PermitLimit: ${LOGIN_RATE_LIMIT_PERMIT_LIMIT:-5}
      LoginRateLimit__WindowSeconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # The warehouse's gRPC endpoint: plain HTTP/2 inside the compose network
      Inventory__Address: http://inventory:50051
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - images:/data/images
    depends_on:
      postgres:
        condition: service_healthy
      # Started first but not awaited: the app runs Degraded without the warehouse, so a warehouse
      # that never gets healthy must not keep the shop down
      inventory:
        condition: service_started

  postgres:
    image: postgres:18
    # pg_stat_statements counts every statement's calls and time (task R3-04); perf/top-queries.sh lists the costliest
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    # Comes back with Docker after a reboot, so a local `dotnet run` finds it on 5433
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    ports:
      # Localhost only, and 5433 so a Postgres installed on the host can keep 5432
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Mounted at the parent: Postgres 18+ keeps its data in a versioned folder under it
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: first-run setup listens only on the socket, so this waits for the real server
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

  # The Go warehouse (task R2-02). gRPC on 50051 inside the compose network only, never published to
  # the host; the image's own HEALTHCHECK asks the warehouse's gRPC health service.
  inventory:
    build:
      context: warehouse
    environment:
      # The password comes in through PGPASSWORD, which pgx reads, so it needs no quoting or URL encoding
      INVENTORY_DATABASE_URL: host=inventory-db port=5432 dbname=${INVENTORY_DB_NAME:-inventory} user=${INVENTORY_DB_USER:-inventory} sslmode=disable
      PGPASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
      INVENTORY_LOG_LEVEL: ${INVENTORY_LOG_LEVEL:-info}
      # Demos only: holds every inventory call this long, to show the app's deadlines (tests/proof)
      INVENTORY_DELAY_MS: ${INVENTORY_DELAY_MS:-0}
    expose:
      - "50051"
    networks:
      - default
      - inventory-data
    depends_on:
      inventory-db:
        condition: service_healthy

  # The warehouse's own database (task R2-03), on a network the app isn't on, so the app has no route to it
  inventory-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory}
    volumes:
      - inventory-db-data:/var/lib/postgresql
      # Schema and seed, run in name order the first time the volume is empty
      - ./warehouse/db:/docker-entrypoint-initdb.d:ro
    networks:
      - inventory-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  # Only the warehouse and its database; internal, so nothing on it reaches outside Docker
  inventory-data:
    internal: true

volumes:
  postgres-data:
  images:
  inventory-db-data:
