# Who may connect to the app's Postgres, and how (compose services postgres and db-replica). Both read this file
# through hba_file, so the rules also hold for a data volume created before them. They are the rules the postgres
# image writes, plus one for the replica (task R3-10).
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Inside the container (the image's setup scripts, the health checks, docker compose exec): no password
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# db-replica streams the primary's WAL as replicator, a role that may replicate and nothing else
host    replication     replicator      all                     scram-sha-256

# Everyone else, the api and a local dotnet run included, with a password
host    all             all             all                     scram-sha-256
