# The load balancer in front of the three API instances (task R5-02). Mounted over the image's
# /etc/nginx/conf.d/default.conf, so everything here sits inside the http block of the image's nginx.conf. Needs
# Nginx 1.27.3 or later for the resolve parameter; compose, the checks and CI use nginx:1.30.7-alpine.

# Docker's DNS on the compose network. A name that resolves is looked up again every 10 seconds, so an instance that
# comes back with a new address gets traffic without reloading Nginx. A lookup that fails (a stopped or not yet started
# instance: Docker answers SERVFAIL) is retried after resolver_timeout, 30 seconds by default; 5 seconds lets a new
# instance in within about 5 seconds, and Docker's DNS answers in milliseconds. While a lookup fails, Nginx keeps the
# last address it had, and the passive health checks below keep requests away from it
resolver 127.0.0.11 valid=10s;
resolver_timeout 5s;

# SignalR's browser client sends its token in the URL (access_token=...) when it opens a WebSocket, and $request would
# write that token into the access log. This is the request line with the token's value hidden
map $request $request_without_token {
    "~^(?<before>.*[?&]access_token=)[^&\s]*(?<after>.*)$" "${before}[hidden]${after}";
    default $request;
}

# One line per request, saying which instance answered: the proof counts requests per upstream address. A request
# that failed over lists both instances, with their status codes and times in the same order
log_format upstreams '[$time_iso8601] $remote_addr "$request_without_token" $status upstream=$upstream_addr '
                     'upstream_status=$upstream_status time=$upstream_response_time';

upstream api {
    # Shared by all worker processes: least_conn then counts every worker's connections, and resolve needs it
    zone api 64k;

    # Each new request goes to the instance with the fewest open connections. Requests aren't equal (placing an
    # order calls the warehouse and writes to the database; a cached product read takes milliseconds), and live-update
    # WebSockets stay open for minutes, so taking turns would load the instances unevenly
    least_conn;

    # Passive health checks, the only kind open-source Nginx has: one failed connection takes an instance out for
    # 10 seconds, then a single request tries it again. resolve keeps the addresses current (see resolver above), and
    # lets Nginx start while a name doesn't resolve yet; without it, Nginx refuses to start until all three exist
    server api1:8080 max_fails=1 fail_timeout=10s resolve;
    server api2:8080 max_fails=1 fail_timeout=10s resolve;
    server api3:8080 max_fails=1 fail_timeout=10s resolve;

    # Not written here because it is the default since Nginx 1.29.7: idle connections to each instance stay open for
    # the next request (keepalive, over HTTP/1.1), saving a TCP handshake each time. Nginx closes an idle one after 60
    # seconds, before Kestrel would after 130, so a running instance never closes one just as Nginx reuses it. The
    # checks' stop-and-start step runs with it (tests/proof/requirement-5/nginx-checks.sh)
}

# A WebSocket handshake asks the instance to upgrade the connection; any other request to /hubs/ closes it afterwards
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Here rather than at the http level, so it replaces the image's own access log instead of adding a second line
    # for every request
    access_log /var/log/nginx/access.log upstreams;

    # "Server: nginx" without the version, in headers and error pages: the API sends no Server header at all (task 13)
    server_tokens off;

    # Product images may be 2 MB plus the form around them. Nginx's default of 1 MB would refuse them with its own
    # HTML page. Between the API's limit and this one, the API answers with its Problem Details (413,
    # products.image_too_large); only bodies above 4 MB get Nginx's page
    client_max_body_size 4m;

    # A stopped instance's address stops answering: give up on it after 2 seconds instead of the default 60
    proxy_connect_timeout 2s;

    # The default made explicit: a connection error or timeout tries one other instance. A POST that reached an
    # instance is never sent again (that would need non_idempotent), so an order is never placed twice
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    # $http_host keeps the port the client used, so URLs the API builds from Host, such as the OpenAPI document's
    # servers entry, point back through Nginx. $host would drop the port
    proxy_set_header Host              $http_host;
    # Nginx is the public edge and the API trusts one hop: replace any forwarding chain supplied by the caller.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://api;
    }

    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        # Any proxy_set_header in a location replaces all the inherited ones, so the three above are repeated
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # SignalR sends a ping every 15 seconds, so a live connection is never idle this long; the default of 60
        # seconds would still be enough, and this only ends a socket that went silent
        proxy_read_timeout 1h;
    }
}
